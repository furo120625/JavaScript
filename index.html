
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Learning Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header class="topbar">
        <div class="logo">JS Learning Hub</div>

        <div class="search">
            <input type="search" id="search-input" placeholder="Search lessons...">
        </div>

        <div class="account">
            <span class="account-avatar" aria-label="JavaScript Learning Hub">JS</span>
        </div>
    </header>

    <aside class="sidebar">
        <nav>
            <a class="nav-link is-active" href="index.html">Home</a>
            <a class="nav-link" href="#lessons">All lessons</a>
        </nav>
    </aside>

    <main class="main-content">
        <section class="recently-accessed">
            <div class="section-heading"><h2>Recently accessed</h2></div>
            <div class="recent-list" id="recent-list"></div>
        </section>

        <section class="lessons" id="lessons">
            <div class="section-heading"><h2>All lessons</h2></div>
            <div class="lesson-list" id="lesson-list"></div>
        </section>
    </main>

</body>
</html>
